# ----------------------------------------------------------------------------------
#                       Config.yml file for the Experiement.                       #
# ----------------------------------------------------------------------------------
dir_output: "../data/participants/"  # folder for the data
screen:
  id: 1
  distance: 70

general:
  isDebugMode: false
  isWelcomeScreenEnabled: true
  isPhaseOneEnabled: true
  isPhaseTwoEnabled: true
  isPhaseThreeEnabled: true
  isPhaseFourEnabled: true
  welcomeText: |
    Welcome!
    This experiment involves economic decision making and requires you to make several choices.
    You will be asked to make a number of choices.

    The study will last about an hour.

    Your choices are very important in this and will determine your final payment.
  instructionText: "Press any key to start the experiment."
phase1:
  practiseTrials: 5
  trialsPerInterval: 30
  intervals:
    0.97: [0.825, 0.85, 0.875, 0.90, 0.925, 0.95, 0.975, 1.00, 1.025, 1.050, 1.075]
    0.57: [0.41, 0.44, 0.47,  0.50, 0.53, 0.56, 0.59, 0.62, 0.65, 0.68, 0.71]
    0.27: [0.22,0.23, 0.24, 0.25, 0.26, 0.27, 0.28, 0.29, 0.30, 0.31,0.32]
phase2:
  practiseTrials: 100
  realTrials: 300
  defaultSigma: 0.47
  hitProbability: 0.5

phase3:
  practiseTrials: 5
  trialsPerInterval: 50
  intervals:
  - standard_amount: 1
    comparison_amount: 2
    standard_prob: 0.8
    comparison_prob: [0.10, 0.15, 0.20, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.60, 0.65]
  - standard_amount: 2
    comparison_amount: 1
    standard_prob: 0.35
    comparison_prob: [0.35, 0.4, 0.45, 0.50, 0.55, 0.60, 0.65, 0.7, 0.75, 0.8, 0.85, 0.90, 0.95]
phase4:
  realTrials: 8